<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>%WEB_TITLE%</title>
    <meta name="description" content="Table counter for Little Troubles TCG: Cookies, Fights Won and Goals." />
    <!-- instalável na tela inicial (PWA) -->
    <meta name="theme-color" content="#fdf4e3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LT Counter" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background: #fdf4e3;
        overscroll-behavior: none;
        touch-action: manipulation;
      }
      body {
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script>
      // funciona offline depois da primeira visita
      if ('serviceWorker' in navigator && location.protocol === 'https:') {
        addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
      }
    </script>
  </body>
</html>
